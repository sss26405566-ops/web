    // 切換單日展開/收合
    function toggleDay(index) {
      const content = document.getElementById(`content-${index}`);
      const arrow = document.getElementById(`arrow-${index}`);
      const isOpen = content.classList.contains('open');

      if (isOpen) {
        content.classList.remove('open');
        arrow.classList.remove('rotate-180');
      } else {
        content.classList.add('open');
        arrow.classList.add('rotate-180');
      }
      updateToggleAllButtonState();
    }

    // 全部展開 / 全部收合
    function toggleAllDays() {
      const contents = document.querySelectorAll('.accordion-content');
      const anyClosed = Array.from(contents).some(el => !el.classList.contains('open'));

      contents.forEach((content, idx) => {
        const arrow = document.getElementById(`arrow-${idx}`);
        if (anyClosed) {
          content.classList.add('open');
          arrow.classList.add('rotate-180');
        } else {
          content.classList.remove('open');
          arrow.classList.remove('rotate-180');
        }
      });
      updateToggleAllButtonState();
    }

    function updateToggleAllButtonState() {
      const contents = document.querySelectorAll('.accordion-content');
      const allOpen = Array.from(contents).every(el => el.classList.contains('open'));
      const btnText = document.getElementById('toggle-all-text');
      const btnIcon = document.getElementById('toggle-all-icon');
      
      btnText.textContent = allOpen ? '全部收合' : '全部展開';
      if (allOpen) {
        btnIcon.classList.add('rotate-180');
      } else {
        btnIcon.classList.remove('rotate-180');
      }
    }

        tabInfo.className = "flex-1 py-2.5 px-3 sm:px-4 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:bg-slate-100 cursor-pointer";
      } else {
        viewItinerary.classList.add('hidden');

        tabInfo.className = "flex-1 py-2.5 px-3 sm:px-4 rounded-xl text-xs sm:text-sm font-bold transition-all bg-brand-600 text-white shadow-sm cursor-pointer";

            ${t.linkUrl ? `
              <a href="${t.linkUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-link"></i> 店鋪網頁
              </a>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    // 渲染分頁二：住宿總覽卡片
    function renderAccommodations() {
      const container = document.getElementById('accommodations-container');
      container.innerHTML = accommodationsData.map(h => `
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3.5">
          <div class="space-y-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-bold text-indigo-700 bg-indigo-100/80 px-2.5 py-0.5 rounded-md">${h.dates}</span>
              <span class="text-xs font-semibold text-slate-500"><i class="fa-solid fa-map-pin mr-1"></i>${h.area}</span>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-slate-800">${h.name}</h3>
            <p class="text-xs text-slate-600">${h.note}</p>
          </div>
          
          <div class="flex flex-wrap sm:flex-col gap-2 shrink-0">
            <a href="${h.mapUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 text-xs font-semibold text-slate-700 bg-white hover:bg-rose-50 hover:text-rose-600 border border-slate-200 px-3 py-1.5 rounded-lg transition-colors">
              <i class="fa-solid fa-location-dot text-rose-500"></i> Google 地圖
            </a>
            <a href="${h.bookingUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition-colors">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> 訂房／官網
            </a>
            <button onclick="copyText('${h.name.replace(/'/g, "\\'")}', '已複製住宿名稱')" class="inline-flex items-center justify-center gap-1.5 text-xs font-semibold text-slate-600 bg-white hover:bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
              <i class="fa-regular fa-copy"></i> 複製名稱
            </button>
          </div>
        </div>
      `).join('');
    }

    // 渲染與處理行前檢查清單 (儲存於 localStorage)
    const STORAGE_KEY = 'jp_2026_2027_trip_checklist';

    function renderChecklist() {
      const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const container = document.getElementById('checklist-container');

      container.innerHTML = checklistItems.map((item, idx) => {
        const isChecked = !!savedState[idx];
        return `
          <label class="flex items-start gap-3 p-3 rounded-xl border transition-all cursor-pointer select-none ${isChecked ? 'bg-emerald-50/70 border-emerald-200 text-slate-400 line-through' : 'bg-slate-50 border-slate-200/80 text-slate-700 hover:bg-slate-100'}">
            <input type="checkbox" onchange="toggleChecklistItem(${idx})" ${isChecked ? 'checked' : ''} 
                   class="mt-0.5 w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 cursor-pointer shrink-0">
            <span class="text-xs sm:text-sm font-medium leading-snug">${item}</span>
          </label>
        `;
      }).join('');
    }

    function toggleChecklistItem(index) {
      const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      savedState[index] = !savedState[index];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
      renderChecklist();
    }

    function resetChecklist() {
      localStorage.removeItem(STORAGE_KEY);
      renderChecklist();
      showToast('已重設所有檢查項目');
    }

    // 複製文字到剪貼簿 (相容 iFrame 與手機瀏覽器)
    function copyText(text, customMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`${customMsg || '已複製'}：${text}`);
      } catch (err) {
        showToast('複製失敗，請手動選取複製');
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
